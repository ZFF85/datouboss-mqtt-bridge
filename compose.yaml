services:
  datouboss-mqtt-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SERIAL_PORT: /dev/inverter
    devices:
      - ${SERIAL_DEVICE:?Set the inverter adapter path in .env}:/dev/inverter
    extra_hosts:
      - host.docker.internal:host-gateway
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
