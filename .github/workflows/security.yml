name: Security scans

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck for newly disclosed vulnerabilities every Monday at 07:17 UTC.
    - cron: '17 7 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime requirements and their dependencies
        run: >-
          python -m pip_audit --strict -r requirements.txt
          --progress-spinner off --format json
          --output "$RUNNER_TEMP/pip-audit.json"
      - name: Show audit report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/pip-audit.json"; then
            python -m json.tool "$RUNNER_TEMP/pip-audit.json"
          fi
      - name: Save Python audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dependency-audit
          path: ${{ runner.temp }}/pip-audit.json
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image with the current base image
        run: docker build --pull --tag datouboss-mqtt-bridge:security .
      - name: Export image for isolated scanning
        run: >-
          docker image save --output "$RUNNER_TEMP/datouboss-mqtt-image.tar"
          datouboss-mqtt-bridge:security
      - name: Scan OS and application packages with Grype
        # Grype v0.118.0, pinned by immutable container digest.
        # Only the image archive is mounted, without the host Docker socket.
        run: |
          set -o pipefail
          docker run --rm \
            --env GRYPE_CHECK_FOR_APP_UPDATE=false \
            --mount "type=bind,source=$RUNNER_TEMP/datouboss-mqtt-image.tar,target=/scan/image.tar,readonly" \
            anchore/grype@sha256:8a93fc48da96bd6ec5981279d099b69de11541dc68fdf222fb9161f8ff284af7 \
            docker-archive:/scan/image.tar --fail-on high --output table \
            | tee "$RUNNER_TEMP/grype.txt"
      - name: Save container vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-vulnerability-scan
          path: ${{ runner.temp }}/grype.txt
          retention-days: 14
          if-no-files-found: warn
