name: Security scans

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck for newly disclosed vulnerabilities every Monday at 07:17 UTC.
    - cron: '17 7 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime requirements and their dependencies
        run: >-
          python -m pip_audit --strict -r requirements.txt
          --progress-spinner off --format json
          --output "$RUNNER_TEMP/pip-audit.json"
      - name: Show audit report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/pip-audit.json"; then
            python -m json.tool "$RUNNER_TEMP/pip-audit.json"
          fi
      - name: Save Python audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dependency-audit
          path: ${{ runner.temp }}/pip-audit.json
          retention-days: 14
          if-no-files-found: warn
